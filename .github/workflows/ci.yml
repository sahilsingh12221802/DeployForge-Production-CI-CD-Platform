name: DeployForge CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint application
        run: |
          pip install ruff
          ruff check app/

      - name: Security scan
        run: |
          pip install pip-audit
          pip-audit

      - name: Build Docker image
        run: |
          docker build -t deployforge:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::478982786478:role/deployforge-github-actions
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: deployforge
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag deployforge:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: deployforge
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}